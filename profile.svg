<svg width="450" height="320" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                .container {
                    display: flex;
                    flex-direction: column;
                    margin: 0;
                    /*padding: 15px;*/
                    box-sizing: border-box;
                    font-family: 'Monaco', 'Consolas', 'Courier New', monospace;
                    font-size: 14px;
                    /*background: #0d1117;*/
                    /*color: #e6edf3;*/
                    border-radius: 6px;
                    line-height: 1.6;
                }
                .container * {
                    margin: 0;
                }
                .keyword { color: #ff7b72; }
                .variable { color: #79c0ff; }
                .property { color: #d2a8ff; }
                .string { color: #a5d6ff; }
                .value { color: #7ee787; }
                .punctuation { color: #e6edf3; }
                .array-item { color: #ffa657; }
                .link { color: #a5d6ff; text-decoration: underline; }
                p {
                    margin: 2px 0;
                }
            </style>
            <div class="container">
                <p>
                    <span class="keyword">const</span>
                    <span class="variable">userInfo</span>
                    <span class="punctuation">= {</span>
                </p>


                <p style="padding-left: 1rem">
                    <span class="property">info</span><span class="punctuation">: {</span>
                </p>
                <p style="padding-left: 2rem">
                    <span class="property">name</span><span class="punctuation">: </span>
                    <span class="string">"Matheus Cristian"</span><span class="punctuation">,</span>
                </p>
                <p style="padding-left: 2rem">
                    <span class="property">location</span><span class="punctuation">: </span>
                    <span class="string">"Brazil"</span><span class="punctuation">,</span>
                </p>
                <p style="padding-left: 2rem">
                    <span class="property">education</span><span class="punctuation">: </span>
                    <span class="string">"System Development Technician at Senai"</span><span class="punctuation">,</span>
                </p>
                <p style="padding-left: 2rem">
                    <span class="property">email</span><span class="punctuation">: </span>
                    <span class="string">"matheuscristianrg@gmail.com"</span><span class="punctuation"></span>
                </p>
                <p style="padding-left: 1rem">
                    <span class="punctuation">}</span>
                </p>


                <p style="padding-left: 1rem">
                    <span class="property">tech</span><span class="punctuation">: {</span>
                </p>
                <p style="padding-left: 2rem">
                    <span class="property">langs</span><span class="punctuation">: [</span>
                    <span class="string">"javascript"</span><span class="punctuation">, </span>
                    <span class="string">"C"</span><span class="punctuation">, </span>
                    <span class="string">"Rust"</span><span class="punctuation">, </span>
                    <span class="string">"Python"</span>
                    <span class="punctuation">]</span><span class="punctuation">,</span>
                </p>
                <p style="padding-left: 2rem">
                    <span class="property">editor</span><span class="punctuation">: </span>
                    <span class="string">"Zed"</span>
                </p>
                <p style="padding-left: 2rem">
                    <span class="property">achievements</span><span class="punctuation">: [</span>
                    <span class="string">"OBI Silver"</span><span class="punctuation">, </span>
                    <span class="string">"OBI Bronze"</span>
                    <span class="punctuation">]</span><span class="punctuation">,</span>
                </p>
                <p style="padding-left: 2rem">
                    <span class="property">github</span><span class="punctuation">: </span>
                    <span class="string">"https://github.com/NthCristian"</span><span class="punctuation">,</span>
                </p>
                <p style="padding-left: 1rem">
                    <span class="punctuation">}</span>
                </p>


                <p><span class="punctuation">}</span><span class="punctuation">;</span></p>
            </div>
        </div>
    </foreignObject>
</svg>
