<svg width="400" height="200" xmlns="http://www.w3.org/2000/svg">
    <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
            <style>
                .container {
                    display: flex;
                    flex-direction: column;
                    margin: 0;
                    /*padding: 15px;*/
                    box-sizing: border-box;
                    font-family: "Monaco", "Consolas", "Courier New", monospace;
                    font-size: 14px;
                    /*background: #0d1117;*/
                    /*color: #e6edf3;*/
                    border-radius: 6px;
                    line-height: 1.4;
                }
                .container * {
                    margin: 0;
                }
                .keyword {
                    color: #ff7b72;
                } /* const */
                .variable {
                    color: #79c0ff;
                } /* userInfo */
                .property {
                    color: #d2a8ff;
                } /* name, username, langs, editor */
                .string {
                    color: #a5d6ff;
                } /* String values */
                .value {
                    color: #7ee787;
                } /* Other values */
                .punctuation {
                    color: #e6edf3;
                } /* Brackets, commas */
                .array-item {
                    color: #ffa657;
                } /* Array values */
            </style>
            <div class="container">
                <p>
                    <span class="keyword">const</span>
                    <span class="variable">userInfo</span>
                    <span class="punctuation">= {</span>
                </p>
                <p style="padding-left: 1rem">
                    <span class="property">name</span
                    ><span class="punctuation">: </span>
                    <span class="string">"Matheus Cristian"</span
                    ><span class="punctuation">,</span>
                </p>
                <p style="padding-left: 1rem">
                    <span class="property">username</span
                    ><span class="punctuation">: </span>
                    <span class="string">"nthcristian"</span
                    ><span class="punctuation">,</span>
                </p>
                <p style="padding-left: 1rem">
                    <span class="property">langs</span
                    ><span class="punctuation">: [</span>
                    <span class="string">"javascript"</span
                    ><span class="punctuation">, </span>
                    <span class="string">"C"</span
                    ><span class="punctuation">, </span>
                    <span class="string">"Rust"</span
                    ><span class="punctuation">, </span>
                    <span class="string">"Python"</span>
                    <span class="punctuation">]</span
                    ><span class="punctuation">,</span>
                </p>
                <p style="padding-left: 1rem">
                    <span class="property">editor</span
                    ><span class="punctuation">: </span>
                    <span class="string">"Zed"</span>
                </p>
                <p>
                    <span class="punctuation">}</span
                    ><span class="punctuation">;</span>
                </p>
            </div>
        </div>
    </foreignObject>
</svg>
